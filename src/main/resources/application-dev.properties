# ============================================
# CONFIGURACIÓN DE H2 (Base de datos)
# ============================================
# URL de conexión (base de datos en memoria)
spring.datasource.url=jdbc:h2:mem:shoptrackerdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================
# CONSOLA H2 (para ver la DB en navegador)
# ============================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# CONFIGURACIÓN JPA/HIBERNATE
# ============================================
# Mostrar SQL en consola (útil para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Crear/actualizar tablas automáticamente
spring.jpa.hibernate.ddl-auto=create-drop

# Dialecto de H2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ============================================
# EJECUTAR SCRIPT DE DATOS INICIALES
# ============================================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true